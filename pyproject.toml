[project]
name = "agents"
version = "0.1.0"
description = "A career chatbot to act as an interactive resume"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "gradio>=5.22.0",
    "openai>=1.68.2",
    "pydantic>=2.11.7",
    "pypdf>=5.4.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]
